<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>图片分辨率调整 · 仅像素输入</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        }
        html, body {
            overflow: hidden;
            height: 100%;
            width: 100%;
            position: fixed;
        }
        body {
            background: #f5f7fb;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
            margin: 0;
        }
        .card {
            background: #ffffff;
            border-radius: 28px;
            box-shadow: 0 20px 40px -12px rgba(0, 0, 0, 0.25);
            max-width: 1100px;
            width: 100%;
            max-height: 96vh;
            padding: 24px 28px;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            overflow-x: hidden;
            scrollbar-width: thin;
            scrollbar-color: #b8cae0 #f0f4fa;
        }
        .card::-webkit-scrollbar {
            width: 6px;
        }
        .card::-webkit-scrollbar-track {
            background: #f0f4fa;
            border-radius: 10px;
        }
        .card::-webkit-scrollbar-thumb {
            background: #b8cae0;
            border-radius: 10px;
        }
        h1 {
            font-size: 1.7rem;
            font-weight: 600;
            letter-spacing: -0.02em;
            color: #0b1b2b;
            margin-top: 0;
            margin-bottom: 4px;
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }
        h1 span {
            background: #eef3fc;
            font-size: 0.85rem;
            font-weight: 500;
            padding: 4px 12px;
            border-radius: 30px;
            color: #2d5f9a;
        }
        .subhead {
            color: #5e6f8d;
            margin-bottom: 18px;
            font-size: 0.95rem;
            border-left: 3px solid #2d5f9a;
            padding-left: 16px;
        }
        .grid {
            display: flex;
            flex-wrap: wrap;
            gap: 24px;
        }
        .controls-panel {
            flex: 1.1;
            min-width: 280px;
        }
        .preview-panel {
            flex: 1.4;
            min-width: 300px;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }
        .file-upload-area {
            background: #f8fafd;
            border: 2px dashed #b8cae0;
            border-radius: 20px;
            padding: 22px 16px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
            margin-bottom: 20px;
        }
        .file-upload-area:hover {
            background: #eef4ff;
            border-color: #2d5f9a;
        }
        .file-upload-area input[type="file"] {
            display: none;
        }
        .upload-label {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            color: #2d5f9a;
            font-weight: 500;
            cursor: pointer;
        }
        .upload-label svg {
            width: 38px;
            height: 38px;
            stroke: #2d5f9a;
            fill: none;
            stroke-width: 1.8;
        }
        .upload-label .small {
            font-size: 0.8rem;
            color: #6c7d9c;
            font-weight: 400;
        }
        .control-group {
            background: #f8fafd;
            border-radius: 18px;
            padding: 18px;
            margin-bottom: 18px;
            border: 1px solid #e3e9f2;
        }
        .control-group .group-title {
            font-weight: 600;
            color: #1e2e45;
            font-size: 0.95rem;
            margin-bottom: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .control-group .group-title .hint {
            font-weight: 400;
            font-size: 0.78rem;
            color: #6c7d9c;
            background: #eef3fc;
            padding: 2px 10px;
            border-radius: 20px;
        }
        /* 分辨率输入行 */
        .resolution-row {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }
        .resolution-row .input-wrapper {
            flex: 1;
            display: flex;
            align-items: center;
            background: #ffffff;
            border: 1px solid #cfddee;
            border-radius: 14px;
            padding: 6px 8px 6px 14px;
            min-width: 110px;
        }
        .resolution-row .input-wrapper span {
            color: #6c7d9c;
            font-size: 0.85rem;
            margin-right: 6px;
            font-weight: 500;
        }
        .resolution-row input[type="number"] {
            width: 100%;
            border: none;
            padding: 8px 0;
            font-size: 1.05rem;
            font-weight: 600;
            color: #0b1b2b;
            background: transparent;
            outline: none;
            text-align: left;
        }
        .resolution-row input[type="number"]:focus {
            color: #1e4a7a;
        }
        .resolution-row input[type="number"]::-webkit-inner-spin-button {
            opacity: 0.5;
        }
        .resolution-row .x-mark {
            font-size: 1.1rem;
            font-weight: 600;
            color: #8899b0;
            flex-shrink: 0;
        }
        .resolution-row .lock-icon {
            background: #eef3fc;
            border-radius: 12px;
            padding: 8px 14px;
            font-size: 0.8rem;
            font-weight: 500;
            color: #2d5f9a;
            white-space: nowrap;
            cursor: pointer;
            user-select: none;
            transition: 0.1s;
            border: 1px solid transparent;
            flex-shrink: 0;
        }
        .resolution-row .lock-icon.active {
            background: #2d5f9a;
            color: white;
            border-color: #2d5f9a;
        }
        .resolution-row .lock-icon:hover {
            background: #d9e6ff;
        }
        .resolution-row .lock-icon.active:hover {
            background: #1e4a7a;
        }
        .reset-btn {
            background: #ffffff;
            border: 1px solid #cfddee;
            border-radius: 40px;
            padding: 10px 20px;
            font-size: 0.9rem;
            font-weight: 500;
            color: #2d5f9a;
            cursor: pointer;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            margin-top: 4px;
        }
        .reset-btn:hover {
            background: #eef3fc;
            border-color: #2d5f9a;
        }
        .reset-btn:active {
            transform: scale(0.98);
        }
        /* 预览容器：固定高度，图片视觉大小不变 */
        .preview-container {
            background: #f0f4fa;
            border-radius: 24px;
            padding: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid #dfe8f3;
            position: relative;
            height: 340px;
            overflow: hidden;
        }
        #previewCanvas {
            display: block;
            object-fit: contain;
            border-radius: 12px;
            box-shadow: 0 8px 24px -8px rgba(0, 0, 0, 0.2);
            background: #ffffff;
        }
        .empty-preview {
            text-align: center;
            color: #8899b0;
            font-size: 0.95rem;
            padding: 30px 16px;
        }
        .empty-preview svg {
            width: 48px;
            height: 48px;
            stroke: #b8cae0;
            fill: none;
            margin-bottom: 10px;
            stroke-width: 1.5;
        }
        .info-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.85rem;
            color: #3b4e6b;
            background: #f8fafd;
            padding: 10px 16px;
            border-radius: 16px;
            border: 1px solid #e3e9f2;
        }
        .info-bar .badge {
            background: #e3e9f2;
            padding: 4px 12px;
            border-radius: 30px;
            font-weight: 500;
            color: #1e3a6b;
            font-size: 0.85rem;
        }
        .hidden {
            display: none;
        }
        .action-buttons {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }
        .btn-primary, .btn-save {
            border: none;
            border-radius: 40px;
            padding: 12px 22px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            flex: 1;
            justify-content: center;
            box-shadow: 0 4px 12px rgba(45, 95, 154, 0.3);
        }
        .btn-primary {
            background: #2d5f9a;
            color: white;
        }
        .btn-primary:hover {
            background: #1e4a7a;
            box-shadow: 0 6px 16px rgba(45, 95, 154, 0.4);
        }
        .btn-save {
            background: #27ae60;
            color: white;
            box-shadow: 0 4px 12px rgba(39, 174, 96, 0.3);
        }
        .btn-save:hover {
            background: #1e8e4f;
            box-shadow: 0 6px 16px rgba(39, 174, 96, 0.4);
        }
        .btn-primary:active, .btn-save:active {
            transform: scale(0.98);
        }
        .btn-primary:disabled, .btn-save:disabled {
            opacity: 0.5;
            pointer-events: none;
            box-shadow: none;
        }
        .footer-note {
            margin-top: 14px;
            font-size: 0.8rem;
            color: #8899b0;
            text-align: center;
        }
    </style>
</head>
<body>
<div class="card">
    <h1>
        🖼️ 分辨率调整
        <span>像素输入</span>
    </h1>
    <div class="subhead">上传图片，直接输入宽 × 高像素值调整分辨率，预览视觉大小保持不变</div>

    <div class="grid">
        <!-- 左侧控制区 -->
        <div class="controls-panel">
            <div class="file-upload-area" id="uploadArea">
                <input type="file" id="imageInput" accept="image/png, image/jpeg, image/jpg, image/webp, image/gif, image/bmp">
                <label for="imageInput" class="upload-label">
                    <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
                        <polyline points="17 8 12 3 7 8" />
                        <line x1="12" y1="3" x2="12" y2="15" />
                    </svg>
                    <span>点击选择图片</span>
                    <span class="small">支持 PNG, JPG, WEBP, GIF, BMP</span>
                </label>
            </div>

            <!-- 分辨率输入区 -->
            <div class="control-group">
                <div class="group-title">
                    📐 调整分辨率
                    <span class="hint">输入像素值</span>
                </div>
                <div class="resolution-row">
                    <div class="input-wrapper">
                        <span>W</span>
                        <input type="number" id="widthInput" min="1" max="10000" value="800" step="1" placeholder="宽度">
                    </div>
                    <span class="x-mark">×</span>
                    <div class="input-wrapper">
                        <span>H</span>
                        <input type="number" id="heightInput" min="1" max="10000" value="600" step="1" placeholder="高度">
                    </div>
                    <div class="lock-icon active" id="lockAspectBtn" title="锁定宽高比">🔒 锁定</div>
                </div>
            </div>

            <button class="reset-btn" id="resetBtn">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8" />
                    <path d="M3 3v5h5" />
                </svg>
                重置为原始尺寸
            </button>
        </div>

        <!-- 右侧预览区 -->
        <div class="preview-panel">
            <div class="preview-container" id="previewContainer">
                <canvas id="previewCanvas" class="hidden"></canvas>
                <div class="empty-preview" id="emptyPreview">
                    <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="3" y="3" width="18" height="18" rx="2" ry="2" />
                        <circle cx="8.5" cy="8.5" r="1.5" fill="#b8cae0" stroke="none" />
                        <polyline points="21 15 16 10 5 21" />
                    </svg>
                    <p>尚未上传图片</p>
                </div>
            </div>

            <div class="info-bar">
                <span>当前分辨率</span>
                <span class="badge" id="currentSizeBadge">— × —</span>
            </div>

            <div class="action-buttons">
                <button class="btn-primary" id="downloadBtn" disabled>
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
                        <polyline points="7 10 12 15 17 10" />
                        <line x1="12" y1="15" x2="12" y2="3" />
                    </svg>
                    下载调整后图片
                </button>
                <button class="btn-save" id="saveBtn" disabled>
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z" />
                        <polyline points="17 21 17 13 7 13 7 21" />
                        <polyline points="7 3 7 8 15 8" />
                    </svg>
                    保存图片
                </button>
            </div>
            <div class="footer-note">
                ⚡ 宽度和高度的范围限制在 1～10000 像素之间 · 预览尺寸固定不变
            </div>
        </div>
    </div>
</div>

<script>
    (function() {
        const imageInput = document.getElementById('imageInput');
        const uploadArea = document.getElementById('uploadArea');
        const previewCanvas = document.getElementById('previewCanvas');
        const emptyPreview = document.getElementById('emptyPreview');
        const widthInput = document.getElementById('widthInput');
        const heightInput = document.getElementById('heightInput');
        const lockAspectBtn = document.getElementById('lockAspectBtn');
        const resetBtn = document.getElementById('resetBtn');
        const downloadBtn = document.getElementById('downloadBtn');
        const saveBtn = document.getElementById('saveBtn');
        const currentSizeBadge = document.getElementById('currentSizeBadge');
        const previewContainer = document.getElementById('previewContainer');

        let originalImage = null;
        let originalWidth = 0;
        let originalHeight = 0;
        let aspectRatio = 1;
        let lockAspect = true;
        let isUpdating = false;

        setControlsEnabled(false);

        function setControlsEnabled(enabled) {
            const controls = [widthInput, heightInput, lockAspectBtn, resetBtn, downloadBtn, saveBtn];
            controls.forEach(el => {
                if (enabled) {
                    el.removeAttribute('disabled');
                } else {
                    el.setAttribute('disabled', 'disabled');
                }
            });
            if (!enabled) {
                downloadBtn.disabled = true;
                saveBtn.disabled = true;
            }
        }

        // 锁定宽高比时，根据变化的字段同步另一个
        function applyAspectLock(changedField) {
            if (!originalImage || !lockAspect || isUpdating) return;
            isUpdating = true;
            try {
                let w = parseFloat(widthInput.value) || 1;
                let h = parseFloat(heightInput.value) || 1;

                if (changedField === 'width') {
                    h = Math.round(w / aspectRatio);
                    h = Math.min(10000, Math.max(1, h));
                    heightInput.value = h;
                } else if (changedField === 'height') {
                    w = Math.round(h * aspectRatio);
                    w = Math.min(10000, Math.max(1, w));
                    widthInput.value = w;
                }
            } finally {
                isUpdating = false;
            }
        }

        // 渲染预览：实际像素 = 目标分辨率，显示尺寸固定（基于原始比例）
        function renderPreview() {
            if (!originalImage) return;

            let targetW = parseInt(widthInput.value, 10);
            let targetH = parseInt(heightInput.value, 10);

            if (isNaN(targetW) || targetW < 1) targetW = 1;
            if (isNaN(targetH) || targetH < 1) targetH = 1;
            targetW = Math.min(10000, targetW);
            targetH = Math.min(10000, targetH);

            if (parseInt(widthInput.value, 10) !== targetW) widthInput.value = targetW;
            if (parseInt(heightInput.value, 10) !== targetH) heightInput.value = targetH;

            // 实际画布尺寸 = 目标分辨率
            previewCanvas.width = targetW;
            previewCanvas.height = targetH;
            const ctx = previewCanvas.getContext('2d');
            ctx.clearRect(0, 0, targetW, targetH);
            ctx.drawImage(originalImage, 0, 0, targetW, targetH);

            // 显示尺寸固定：基于原始图片比例填充容器，不随分辨率变化
            const containerWidth = previewContainer.clientWidth - 28;
            const containerHeight = previewContainer.clientHeight - 28;
            const displayAspect = originalWidth / originalHeight;
            let displayW, displayH;

            if (containerWidth / containerHeight > displayAspect) {
                displayH = containerHeight;
                displayW = displayH * displayAspect;
            } else {
                displayW = containerWidth;
                displayH = displayW / displayAspect;
            }

            previewCanvas.style.width = displayW + 'px';
            previewCanvas.style.height = displayH + 'px';

            currentSizeBadge.textContent = `${targetW} × ${targetH}`;
        }

        function resetToOriginal() {
            if (!originalImage) return;
            widthInput.value = originalWidth;
            heightInput.value = originalHeight;
            renderPreview();
        }

        function handleImageFile(file) {
            if (!file || !file.type.startsWith('image/')) {
                alert('请选择有效的图片文件');
                return;
            }

            const reader = new FileReader();
            reader.onload = (e) => {
                const img = new Image();
                img.onload = () => {
                    originalImage = img;
                    originalWidth = img.naturalWidth;
                    originalHeight = img.naturalHeight;
                    aspectRatio = originalWidth / originalHeight;

                    previewCanvas.classList.remove('hidden');
                    emptyPreview.classList.add('hidden');

                    setControlsEnabled(true);

                    widthInput.value = originalWidth;
                    heightInput.value = originalHeight;

                    lockAspect = true;
                    lockAspectBtn.classList.add('active');
                    lockAspectBtn.textContent = '🔒 锁定';

                    renderPreview();
                };
                img.onerror = () => {
                    alert('图片加载失败，请尝试其他文件');
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }

        // 事件绑定
        imageInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                handleImageFile(file);
            }
            imageInput.value = '';
        });

        uploadArea.addEventListener('click', () => {
            imageInput.click();
        });

        // 宽度输入
        widthInput.addEventListener('input', () => {
            if (!originalImage || isUpdating) return;
            if (lockAspect) {
                applyAspectLock('width');
            }
            renderPreview();
        });

        // 高度输入
        heightInput.addEventListener('input', () => {
            if (!originalImage || isUpdating) return;
            if (lockAspect) {
                applyAspectLock('height');
            }
            renderPreview();
        });

        // 失焦时修正数值范围
        widthInput.addEventListener('blur', () => {
            if (!originalImage) return;
            let w = parseInt(widthInput.value, 10);
            if (isNaN(w) || w < 1) w = 1;
            if (w > 10000) w = 10000;
            widthInput.value = w;
            if (lockAspect) {
                applyAspectLock('width');
            }
            renderPreview();
        });

        heightInput.addEventListener('blur', () => {
            if (!originalImage) return;
            let h = parseInt(heightInput.value, 10);
            if (isNaN(h) || h < 1) h = 1;
            if (h > 10000) h = 10000;
            heightInput.value = h;
            if (lockAspect) {
                applyAspectLock('height');
            }
            renderPreview();
        });

        // 锁定宽高比切换
        lockAspectBtn.addEventListener('click', () => {
            if (!originalImage) return;
            lockAspect = !lockAspect;
            if (lockAspect) {
                lockAspectBtn.classList.add('active');
                lockAspectBtn.textContent = '🔒 锁定';
                applyAspectLock('width');
            } else {
                lockAspectBtn.classList.remove('active');
                lockAspectBtn.textContent = '🔓 解锁';
            }
            renderPreview();
        });

        // 重置
        resetBtn.addEventListener('click', () => {
            if (!originalImage) return;
            resetToOriginal();
        });

        // 下载
        downloadBtn.addEventListener('click', () => {
            if (!originalImage || previewCanvas.classList.contains('hidden')) return;
            const link = document.createElement('a');
            link.download = `resized_${widthInput.value}x${heightInput.value}.png`;
            link.href = previewCanvas.toDataURL('image/png');
            link.click();
        });

        // 保存
        saveBtn.addEventListener('click', () => {
            if (!originalImage || previewCanvas.classList.contains('hidden')) return;
            const link = document.createElement('a');
            link.download = `saved_${widthInput.value}x${heightInput.value}.png`;
            link.href = previewCanvas.toDataURL('image/png');
            link.click();
        });

        // 拖拽支持
        previewContainer.addEventListener('dragover', (e) => e.preventDefault());
        previewContainer.addEventListener('drop', (e) => {
            e.preventDefault();
            const file = e.dataTransfer.files[0];
            if (file && file.type.startsWith('image/')) {
                handleImageFile(file);
            }
        });
        uploadArea.addEventListener('dragover', (e) => e.preventDefault());
        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            const file = e.dataTransfer.files[0];
            if (file && file.type.startsWith('image/')) {
                handleImageFile(file);
            }
        });

        // 阻止触摸滚动
        document.body.addEventListener('touchmove', (e) => {
            if (e.target.closest('.card')) {
                return;
            }
            e.preventDefault();
        }, { passive: false });
    })();
</script>
</body>
</html>
